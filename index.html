<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Currículos Profissional</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Boldonse:wght@400;700&display=swap');
        
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
            --bg-color: #f4f7f6;
            --form-bg: #ffffff;
            --text-color: #333;
            --danger-color: #e74c3c;
            --success-color: #27ae60;
        }

        body {
            font-family: 'Boldonse', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Layout Coluna de Formulário */
        .container {
            width: 100%;
            max-width: 500px;
            background: var(--form-bg);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            height: fit-content;
        }

        /* Coluna de Preview Fixa */
        #cv-preview-container {
            width: 100%;
            max-width: 800px;
            position: sticky;
            top: 20px;
        }

        .form-group { margin-bottom: 12px; }
        .form-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .form-row .form-group { flex: 1; min-width: 140px; }

        label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 0.85em; }
        input, select, textarea {
            width: 100%; padding: 8px; border: 1px solid #ccc;
            border-radius: 4px; box-sizing: border-box; font-family: inherit;
        }

        button {
            background-color: var(--primary-color); color: white; border: none;
            padding: 12px; border-radius: 4px; cursor: pointer; width: 100%;
            transition: 0.3s; margin-top: 10px; font-weight: bold;
        }
        
        .btn-add { background-color: #2980b9; margin-bottom: 15px; }
        .btn-print { background-color: var(--success-color); font-size: 1.1em; margin-bottom: 15px; }

        /* Estilos do Currículo (Folha A4) */
        #cv-output {
            background: white;
            padding: 50px;
            min-height: 1050px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border-radius: 4px;
            box-sizing: border-box;
        }

        .cv-header {
            text-align: center;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .cv-photo {
            width: 110px; height: 110px; border-radius: 50%;
            object-fit: cover; border: 3px solid var(--primary-color);
            margin-bottom: 10px; display: none; margin-inline: auto;
        }

        .cv-header h1 { margin: 0; color: var(--primary-color); text-transform: uppercase; font-size: 1.8em; }
        .cv-header h2 { margin: 5px 0; color: var(--secondary-color); font-size: 1.2em; font-weight: bold; }
        
        .cv-contact-info { font-size: 0.9em; color: #444; line-height: 1.6; }
        .cv-section { margin-bottom: 20px; }
        .cv-section h3 {
            border-bottom: 1px solid #ddd; padding-bottom: 3px;
            margin-bottom: 10px; color: var(--primary-color); font-size: 1.1em;
            text-transform: uppercase;
        }

        .cv-text-block { white-space: pre-wrap; font-size: 0.95em; line-height: 1.5; }
        .cv-exp-item { margin-bottom: 12px; }
        .cv-exp-header { display: flex; justify-content: space-between; font-weight: bold; }

        @media print {
            body { background: white; padding: 0; }
            .container, .btn-print, .btn-add, .btn-remove { display: none !important; }
            #cv-output { box-shadow: none; padding: 0; width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Dados do Currículo</h2>
        <form id="cv-form">
            <div class="form-group">
                <label>Foto de Perfil</label>
                <input type="file" id="foto" accept="image/*" onchange="previewImage(this)">
            </div>

            <div class="form-group">
                <label>Nome Completo</label>
                <input type="text" id="nome" oninput="updateCV()">
            </div>

            <div class="form-group">
                <label>Vaga Desejada</label>
                <input type="text" id="vaga" oninput="updateCV()">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>RG</label>
                    <input type="text" id="rg" placeholder="00.000.000-0" oninput="updateCV()">
                </div>
                <div class="form-group">
                    <label>CPF</label>
                    <input type="text" id="documento" oninput="updateCV()">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Nacionalidade</label>
                    <input type="text" id="nacionalidade" value="Brasileiro(a)" oninput="updateCV()">
                </div>
                <div class="form-group">
                    <label>Naturalidade (Cidade/UF)</label>
                    <input type="text" id="naturalidade" oninput="updateCV()">
                </div>
            </div>

            <div class="form-group">
                <label>Filiação (Nome dos Pais)</label>
                <input type="text" id="filiacao"  oninput="updateCV()">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Data de Nascimento</label>
                    <input type="date" id="nascimento" oninput="updateCV()">
                </div>
                <div class="form-group">
                    <label>Estado Civil</label>
                    <select id="estado_civil" onchange="updateCV()">
                        <option value="Solteiro(a)">Solteiro(a)</option>
                        <option value="Casado(a)">Casado(a)</option>
                        <option value="Divorciado(a)">Divorciado(a)</option>
                        <option value="Viúvo(a)">Viúvo(a)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tem filhos?</label>
                    <select id="filhos" onchange="updateCV()">
                        <option value="Não">Não</option>
                        <option value="Sim">Sim</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="email" oninput="updateCV()">
                </div>
                <div class="form-group">
                    <label>Telefone</label>
                    <input type="tel" id="telefone" oninput="updateCV()">
                </div>
            </div>

            <div class="form-group">
                <label>Endereço Completo</label>
                <input type="text" id="endereco" oninput="updateCV()">
            </div>

            <div class="form-group">
                <label>Objetivo</label>
                <textarea id="objetivo" oninput="updateCV()" rows="3"></textarea>
            </div>

            <div class="form-group">
                <label>Experiência Profissional</label>
                <div id="experiencias-container"></div>
                <button type="button" class="btn-add" onclick="addExp()">+ Adicionar Experiência</button>
            </div>

            <div class="form-group">
                <label>Formação Acadêmica</label>
                <textarea id="formacao" oninput="updateCV()" rows="3"></textarea>
            </div>

            <div class="form-group">
                <label>Competências e Idiomas</label>
                <textarea id="competencias" oninput="updateCV()" rows="3"></textarea>
            </div>
        </form>
    </div>

    <div id="cv-preview-container">
        <button class="btn-print" onclick="baixarPDF()">⬇ Baixar Currículo em PDF</button>
        
        <div id="cv-output">
            <div class="cv-header">
                <img id="out-foto" class="cv-photo">
                <h1 id="out-nome">SEU NOME COMPLETO</h1>
                <h2 id="out-vaga">Vaga Desejada</h2>
                
                <div class="cv-contact-info">
                    <span id="out-info-pessoal">Nacionalidade • Estado Civil • Idade</span><br>
                    <span id="out-naturalidade">Naturalidade: ---</span> | <span id="out-filhos">Filhos: Não</span><br>
                    <span id="out-filiacao">Filiação: ---</span><br>
                    <span id="out-docs">RG: --- | CPF: ---</span><br>
                    <span id="out-endereco">Endereço Completo</span><br>
                    <strong>E-mail:</strong> <span id="out-email">---</span> | <strong>Tel:</strong> <span id="out-tel">---</span>
                </div>
            </div>

            <div class="cv-section">
                <h3>Objetivo</h3>
                <div id="out-objetivo" class="cv-text-block"></div>
            </div>

            <div class="cv-section" id="sec-experiencia">
                <h3>Experiência Profissional</h3>
                <div id="out-exp"></div>
            </div>

            <div class="cv-section">
                <h3>Formação Acadêmica</h3>
                <div id="out-formacao" class="cv-text-block"></div>
            </div>

            <div class="cv-section">
                <h3>Qualificações e Atividades</h3>
                <div id="out-comp" class="cv-text-block"></div>
            </div>
        </div>
    </div>

    <script>
        function previewImage(input) {
            const outFoto = document.getElementById('out-foto');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    outFoto.src = e.target.result;
                    outFoto.style.display = 'block';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function addExp() {
            const container = document.getElementById('experiencias-container');
            const div = document.createElement('div');
            div.className = 'dynamic-block';
            div.style.border = "1px solid #ddd";
            div.style.padding = "10px";
            div.style.marginBottom = "10px";
            div.style.borderRadius = "4px";
            div.innerHTML = `
                <input type="text" placeholder="Empresa" oninput="updateCV()" class="e-emp" style="margin-bottom:5px">
                <input type="text" placeholder="Cargo" oninput="updateCV()" class="e-car" style="margin-bottom:5px">
                <input type="text" placeholder="Período (Ex: 2020 - Atual)" oninput="updateCV()" class="e-per" style="margin-bottom:5px">
                <textarea placeholder="Descrição das atividades" oninput="updateCV()" class="e-des"></textarea>
                <button type="button" onclick="this.parentElement.remove(); updateCV()" style="background:#c0392b; padding:5px; font-size:0.8em; margin-top:5px">Remover</button>
            `;
            container.appendChild(div);
        }

        function updateCV() {
            // Textos Simples
            document.getElementById('out-nome').innerText = document.getElementById('nome').value.toUpperCase() || "SEU NOME COMPLETO";
            document.getElementById('out-vaga').innerText = document.getElementById('vaga').value || "Vaga Desejada";
            document.getElementById('out-email').innerText = document.getElementById('email').value || "---";
            document.getElementById('out-tel').innerText = document.getElementById('telefone').value || "---";
            document.getElementById('out-endereco').innerText = document.getElementById('endereco').value || "Endereço não informado";
            document.getElementById('out-objetivo').innerText = document.getElementById('objetivo').value;
            document.getElementById('out-formacao').innerText = document.getElementById('formacao').value;
            document.getElementById('out-comp').innerText = document.getElementById('competencias').value;
            document.getElementById('out-naturalidade').innerText = "Naturalidade: " + (document.getElementById('naturalidade').value || "---");
            document.getElementById('out-filhos').innerText = "Filhos: " + document.getElementById('filhos').value;
            document.getElementById('out-filiacao').innerText = "Filiação: " + (document.getElementById('filiacao').value || "---");

            // Documentos
            const rg = document.getElementById('rg').value;
            const cpf = document.getElementById('documento').value;
            document.getElementById('out-docs').innerText = `RG: ${rg || '---'} | CPF: ${cpf || '---'}`;

            // Info Pessoal e Idade
            const nac = document.getElementById('nacionalidade').value;
            const est = document.getElementById('estado_civil').value;
            const nasc = document.getElementById('nascimento').value;
            let idadeTxt = "";
            if(nasc) {
                const hoje = new Date();
                const nascData = new Date(nasc);
                let idade = hoje.getFullYear() - nascData.getFullYear();
                const m = hoje.getMonth() - nascData.getMonth();
                if (m < 0 || (m === 0 && hoje.getDate() < nascData.getDate())) idade--;
                idadeTxt = ` • ${idade} anos`;
            }
            document.getElementById('out-info-pessoal').innerText = `${nac} • ${est}${idadeTxt}`;

            // Experiências
            const expOut = document.getElementById('out-exp');
            expOut.innerHTML = "";
            document.querySelectorAll('.dynamic-block').forEach(block => {
                const emp = block.querySelector('.e-emp').value;
                const car = block.querySelector('.e-car').value;
                const per = block.querySelector('.e-per').value;
                const des = block.querySelector('.e-des').value;
                
                if(emp || car) {
                    expOut.innerHTML += `
                        <div class="cv-exp-item">
                            <div class="cv-exp-header"><span>${car} - ${emp}</span><span>${per}</span></div>
                            <div class="cv-text-block">${des}</div>
                        </div>
                    `;
                }
            });
        }

        function baixarPDF() {
            const elemento = document.getElementById('cv-output');
            const nomeArquivo = (document.getElementById('nome').value || 'curriculo') + '.pdf';
            
            const opcoes = {
                margin: 0,
                filename: nomeArquivo,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opcoes).from(elemento).save();
        }
        
        // Iniciar
        addExp();
    </script>
</body>
</html>

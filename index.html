<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Currículos Profissional</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap');
        
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
            --bg-color: #e9ecef;
            --form-bg: #ffffff;
            --text-color: #333;
            --success-color: #27ae60;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Coluna do Formulário */
        .container {
            width: 100%;
            max-width: 450px;
            background: var(--form-bg);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            height: fit-content;
        }

        /* Coluna do Preview */
        #cv-preview-container {
            width: 100%;
            max-width: 800px;
            position: sticky;
            top: 20px;
        }

        .form-group { margin-bottom: 12px; }
        .form-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .form-row .form-group { flex: 1; min-width: 140px; }

        label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 0.85em; color: var(--primary-color); }
        input, select, textarea {
            width: 100%; padding: 10px; border: 1px solid #ccc;
            border-radius: 4px; box-sizing: border-box; font-family: inherit;
        }

        button {
            background-color: var(--primary-color); color: white; border: none;
            padding: 12px; border-radius: 4px; cursor: pointer; width: 100%;
            transition: 0.3s; margin-top: 10px; font-weight: bold;
        }
        
        .btn-add { background-color: #2980b9; margin-bottom: 15px; }
        .btn-print { 
            background-color: var(--success-color); 
            font-size: 1.2em; 
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3);
        }

        /* Estilos da Folha do Currículo */
        #cv-output {
            background: white;
            padding: 50px;
            min-height: 1050px; /* Proporção A4 aproximada */
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-radius: 2px;
            box-sizing: border-box;
        }

        .cv-header {
            text-align: center;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .cv-photo {
            width: 120px; height: 120px; border-radius: 50%;
            object-fit: cover; border: 4px solid var(--primary-color);
            margin-bottom: 15px; display: none; margin-inline: auto;
        }

        .cv-header h1 { margin: 0; color: var(--primary-color); text-transform: uppercase; font-size: 2.2em; letter-spacing: 1px; }
        .cv-header h2 { margin: 5px 0; color: var(--secondary-color); font-size: 1.4em; font-weight: normal; }
        
        .cv-contact-info { font-size: 0.9em; color: #444; line-height: 1.6; margin-top: 10px; }
        .cv-section { margin-bottom: 25px; }
        .cv-section h3 {
            background-color: #f8f9fa;
            border-left: 5px solid var(--primary-color);
            padding: 5px 15px;
            margin-bottom: 12px; 
            color: var(--primary-color); 
            font-size: 1.1em;
            text-transform: uppercase;
        }

        .cv-text-block { white-space: pre-wrap; font-size: 1em; line-height: 1.5; color: #333; }
        .cv-exp-item { margin-bottom: 15px; }
        .cv-exp-header { display: flex; justify-content: space-between; font-weight: bold; border-bottom: 1px dashed #ddd; margin-bottom: 5px; }

        @media print {
            body { background: white; padding: 0; }
            .container, .btn-print, .btn-add { display: none !important; }
            #cv-output { box-shadow: none; padding: 0; width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 style="color: var(--primary-color); border-bottom: 2px solid #eee; padding-bottom: 10px;">Criar Currículo</h2>
        <form id="cv-form">
            <div class="form-group">
                <label>Foto de Perfil</label>
                <input type="file" id="foto" accept="image/*" onchange="previewImage(this)">
            </div>

            <div class="form-group">
                <label>Nome Completo</label>
                <input type="text" id="nome" placeholder="Ex: João da Silva" oninput="updateCV()">
            </div>

            <div class="form-group">
                <label>Vaga Desejada / Cargo</label>
                <input type="text" id="vaga" placeholder="Ex: Analista Administrativo" oninput="updateCV()">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>RG</label>
                    <input type="text" id="rg" placeholder="00.000.000-0" oninput="updateCV()">
                </div>
                <div class="form-group">
                    <label>CPF</label>
                    <input type="text" id="documento" placeholder="000.000.000-00" oninput="updateCV()">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Nacionalidade</label>
                    <input type="text" id="nacionalidade" value="Brasileiro(a)" oninput="updateCV()">
                </div>
                <div class="form-group">
                    <label>Data de Nascimento</label>
                    <input type="date" id="nascimento" oninput="updateCV()">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Estado Civil</label>
                    <select id="estado_civil" onchange="updateCV()">
                        <option value="Solteiro(a)">Solteiro(a)</option>
                        <option value="Casado(a)">Casado(a)</option>
                        <option value="Divorciado(a)">Divorciado(a)</option>
                        <option value="Viúvo(a)">Viúvo(a)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Possui Filhos?</label>
                    <select id="filhos" onchange="updateCV()">
                        <option value="Não">Não</option>
                        <option value="Sim">Sim</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="email" placeholder="email@exemplo.com" oninput="updateCV()">
                </div>
                <div class="form-group">
                    <label>Telefone</label>
                    <input type="tel" id="telefone" placeholder="(00) 00000-0000" oninput="updateCV()">
                </div>
            </div>

            <div class="form-group">
                <label>Endereço Completo</label>
                <input type="text" id="endereco" placeholder="Rua, Número, Bairro, Cidade - UF" oninput="updateCV()">
            </div>

            <div class="form-group">
                <label>Objetivo Profissional</label>
                <textarea id="objetivo" rows="3" placeholder="Resuma suas pretensões profissionais..." oninput="updateCV()"></textarea>
            </div>

            <div class="form-group">
                <label>Experiência Profissional</label>
                <div id="experiencias-container"></div>
                <button type="button" class="btn-add" onclick="addExp()">+ Adicionar Experiência</button>
            </div>

            <div class="form-group">
                <label>Formação Acadêmica</label>
                <textarea id="formacao" rows="3" placeholder="Ex: Graduação em Administração - Unip (2018-2022)" oninput="updateCV()"></textarea>
            </div>

            <div class="form-group">
                <label>Habilidades e Cursos</label>
                <textarea id="competencias" rows="3" placeholder="Ex: Inglês Intermediário, Excel Avançado..." oninput="updateCV()"></textarea>
            </div>
        </form>
    </div>

    <div id="cv-preview-container">
        <button class="btn-print" onclick="baixarPDF()">⬇ BAIXAR CURRÍCULO EM PDF</button>
        
        <div id="cv-output">
            <div class="cv-header">
                <img id="out-foto" class="cv-photo">
                <h1 id="out-nome">NOME COMPLETO</h1>
                <h2 id="out-vaga">Vaga Desejada</h2>
                
                <div class="cv-contact-info">
                    <span id="out-info-pessoal">Nacionalidade • Estado Civil • Filhos: Não • 00 anos</span><br>
                    <span id="out-docs">RG: --- | CPF: ---</span><br>
                    <span id="out-endereco">Endereço não informado</span><br>
                    <strong>E-mail:</strong> <span id="out-email">---</span> | <strong>Tel:</strong> <span id="out-tel">---</span>
                </div>
            </div>

            <div class="cv-section">
                <h3>Objetivo</h3>
                <div id="out-objetivo" class="cv-text-block"></div>
            </div>

            <div class="cv-section" id="sec-experiencia">
                <h3>Experiência Profissional</h3>
                <div id="out-exp"></div>
            </div>

            <div class="cv-section">
                <h3>Formação Acadêmica</h3>
                <div id="out-formacao" class="cv-text-block"></div>
            </div>

            <div class="cv-section">
                <h3>Qualificações e Habilidades</h3>
                <div id="out-comp" class="cv-text-block"></div>
            </div>
        </div>
    </div>

    <script>
        // Função para atualizar a foto
        function previewImage(input) {
            const outFoto = document.getElementById('out-foto');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    outFoto.src = e.target.result;
                    outFoto.style.display = 'block';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // Adicionar campos dinâmicos de experiência
        function addExp() {
            const container = document.getElementById('experiencias-container');
            const div = document.createElement('div');
            div.className = 'dynamic-block';
            div.style.border = "1px solid #eee";
            div.style.padding = "10px";
            div.style.marginBottom = "10px";
            div.style.borderRadius = "4px";
            div.innerHTML = `
                <input type="text" placeholder="Empresa" oninput="updateCV()" class="e-emp" style="margin-bottom:5px">
                <input type="text" placeholder="Cargo" oninput="updateCV()" class="e-car" style="margin-bottom:5px">
                <input type="text" placeholder="Período (Ex: Jan/2020 - Atual)" oninput="updateCV()" class="e-per" style="margin-bottom:5px">
                <textarea placeholder="Breve descrição das atividades" oninput="updateCV()" class="e-des" rows="2"></textarea>
                <button type="button" onclick="this.parentElement.remove(); updateCV()" style="background:#e74c3c; padding:5px; font-size:0.8em; margin-top:5px">Excluir</button>
            `;
            container.appendChild(div);
            updateCV();
        }

        // Função de Atualização Instantânea (Preview)
        function updateCV() {
            // Dados Básicos
            document.getElementById('out-nome').innerText = document.getElementById('nome').value.toUpperCase() || "NOME COMPLETO";
            document.getElementById('out-vaga').innerText = document.getElementById('vaga').value || "Vaga Desejada";
            document.getElementById('out-email').innerText = document.getElementById('email').value || "---";
            document.getElementById('out-tel').innerText = document.getElementById('telefone').value || "---";
            document.getElementById('out-endereco').innerText = document.getElementById('endereco').value || "Endereço não informado";
            document.getElementById('out-objetivo').innerText = document.getElementById('objetivo').value;
            document.getElementById('out-formacao').innerText = document.getElementById('formacao').value;
            document.getElementById('out-comp').innerText = document.getElementById('competencias').value;
            
            // RG e CPF
            const rg = document.getElementById('rg').value;
            const cpf = document.getElementById('documento').value;
            document.getElementById('out-docs').innerText = `RG: ${rg || '---'} | CPF: ${cpf || '---'}`;

            // Lógica de Informações Pessoais (Idade, Filhos, etc)
            const nac = document.getElementById('nacionalidade').value;
            const est = document.getElementById('estado_civil').value;
            const filhos = document.getElementById('filhos').value;
            const nasc = document.getElementById('nascimento').value;
            let idadeTxt = "";
            
            if(nasc) {
                const hoje = new Date();
                const nascData = new Date(nasc);
                let idade = hoje.getFullYear() - nascData.getFullYear();
                const m = hoje.getMonth() - nascData.getMonth();
                if (m < 0 || (m === 0 && hoje.getDate() < nascData.getDate())) {
                    idade--;
                }
                idadeTxt = ` • ${idade} anos`;
            }
            document.getElementById('out-info-pessoal').innerText = `${nac} • ${est} • Filhos: ${filhos}${idadeTxt}`;

            // Renderizar Experiências Profissionais
            const expOut = document.getElementById('out-exp');
            expOut.innerHTML = "";
            const blocos = document.querySelectorAll('.dynamic-block');
            
            blocos.forEach(block => {
                const emp = block.querySelector('.e-emp').value;
                const car = block.querySelector('.e-car').value;
                const per = block.querySelector('.e-per').value;
                const des = block.querySelector('.e-des').value;
                
                if(emp || car) {
                    expOut.innerHTML += `
                        <div class="cv-exp-item">
                            <div class="cv-exp-header">
                                <span>${car} na ${emp}</span>
                                <span>${per}</span>
                            </div>
                            <div class="cv-text-block">${des}</div>
                        </div>
                    `;
                }
            });
        }

        // Função de Download do PDF
        function baixarPDF() {
            const btn = document.querySelector('.btn-print');
            btn.innerText = "Gerando PDF...";
            
            const elemento = document.getElementById('cv-output');
            const nomeArquivo = (document.getElementById('nome').value.replace(/\s+/g, '_') || 'curriculo') + '.pdf';
            
            const opcoes = {
                margin: 0,
                filename: nomeArquivo,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true, letterRendering: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opcoes).from(elemento).save().then(() => {
                btn.innerText = "⬇ BAIXAR CURRÍCULO EM PDF";
            });
        }
        
        // Iniciar com o primeiro campo de experiência vazio
        addExp();
    </script>
</body>
</html>
